<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f13">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>FitTracker · 我的训练</title>
  <style>/* ============================================================
   FitTracker — Styles (Dark Gym Theme)
   ============================================================ */

:root {
  --bg: #0f0f13;
  --bg2: #1a1a24;
  --bg3: #24243a;
  --accent: #ff6b35;
  --accent2: #00c853;
  --accent3: #448aff;
  --text: #e8e8f0;
  --text2: #9999b0;
  --text3: #666680;
  --border: #2a2a3e;
  --danger: #ff3d3d;
  --success: #00c853;
  --warn: #ffc107;
  --radius: 14px;
  --radius-sm: 8px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 15px; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding-bottom: 80px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ========== Top Bar ========== */
.top-bar {
  position: sticky; top: 0; z-index: 100;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  display: flex; align-items: center; gap: 12px;
}
.top-bar h1 {
  font-size: 1.1rem; font-weight: 700;
  flex: 1;
}
.top-bar .week-badge {
  font-size: 0.7rem;
  background: var(--accent);
  color: #fff;
  padding: 2px 10px;
  border-radius: 20px;
  font-weight: 600;
}
.tab-bar {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  position: sticky; top: 53px; z-index: 99;
}
.tab-btn {
  flex: 1; padding: 10px 4px;
  background: none; border: none;
  color: var(--text2); font-size: 0.8rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
  border-bottom: 3px solid transparent;
}
.tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
.tab-btn:active { opacity: 0.7; }

/* ========== Pages ========== */
.page { display: none; padding: 16px; }
.page.active { display: block; }

/* ========== Day Card (Plan View) ========== */
.day-card {
  background: var(--bg2);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  cursor: pointer;
  transition: all 0.2s;
}
.day-card:active { transform: scale(0.98); }
.day-card .day-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 8px;
}
.day-card .day-name {
  font-weight: 700; font-size: 1rem;
  color: var(--accent);
}
.day-card .day-tag {
  font-size: 0.7rem;
  background: var(--bg3);
  color: var(--text2);
  padding: 2px 10px;
  border-radius: 20px;
}
.day-card .part-summary {
  font-size: 0.85rem;
  color: var(--text2);
}
.day-card.today {
  border-color: var(--accent2);
  box-shadow: 0 0 0 1px var(--accent2);
}

/* ========== Workout Detail ========== */
.workout-detail {
  padding: 0;
}
.workout-detail .back-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: none; border: none;
  color: var(--accent3); font-size: 0.9rem;
  cursor: pointer; padding: 8px 0; margin-bottom: 8px;
}
.detail-header {
  margin-bottom: 16px;
}
.detail-header h2 {
  font-size: 1.3rem;
  margin-bottom: 4px;
}
.detail-header .meta {
  color: var(--text2); font-size: 0.85rem;
}

/* Part Section */
.part-section { margin-bottom: 20px; }
.part-title {
  font-size: 1rem; font-weight: 700;
  margin-bottom: 10px;
  color: var(--text);
}

/* Exercise Card */
.exercise-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-bottom: 8px;
}
.exercise-card .ex-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 6px;
}
.exercise-card .ex-name {
  font-size: 0.95rem;
  font-weight: 600;
  flex: 1;
}
.exercise-card .ex-alt {
  font-size: 0.7rem;
  color: var(--text3);
  margin-top: 2px;
}
.exercise-card .ex-meta {
  display: flex; gap: 12px;
  font-size: 0.8rem; color: var(--text2);
  margin-bottom: 6px;
}
.exercise-card .ex-meta span { background: var(--bg3); padding: 1px 8px; border-radius: 10px; }
.exercise-card .ex-tips {
  font-size: 0.78rem;
  color: var(--text3);
  margin-bottom: 8px;
  line-height: 1.4;
}
.exercise-card .ex-video-btn {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.78rem;
  color: var(--accent3);
  background: none; border: 1px solid var(--accent3);
  padding: 4px 12px; border-radius: 20px;
  cursor: pointer; transition: 0.2s;
  text-decoration: none;
}
.exercise-card .ex-video-btn:hover { background: rgba(68,138,255,0.1); }
.exercise-card .ex-video-btn:active { opacity: 0.7; }

.exercise-card .set-inputs {
  display: flex; gap: 6px; align-items: center;
  margin-top: 8px; padding-top: 8px;
  border-top: 1px solid var(--border);
}
.set-inputs input {
  width: 60px; padding: 4px 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 6px; color: var(--text); font-size: 0.85rem;
  text-align: center;
}
.set-inputs input:focus { outline: none; border-color: var(--accent); }
.set-inputs input::placeholder { color: var(--text3); }
.set-inputs .set-label { font-size: 0.75rem; color: var(--text3); min-width: 20px; }
.set-inputs .set-done {
  background: none; border: 2px solid var(--text3);
  width: 28px; height: 28px; border-radius: 50%;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  color: var(--text3); font-size: 0.8rem;
  transition: all 0.2s;
  flex-shrink: 0;
}
.set-inputs .set-done.done {
  background: var(--accent2); border-color: var(--accent2);
  color: #fff;
}
.set-inputs .set-done:active { transform: scale(0.9); }

/* ========== Start Workout Button ========== */
.start-workout-btn {
  display: block; width: 100%;
  padding: 16px;
  background: var(--accent);
  color: #fff; border: none;
  border-radius: var(--radius);
  font-size: 1.1rem; font-weight: 700;
  cursor: pointer; transition: 0.2s;
  margin-bottom: 20px;
}
.start-workout-btn:active { transform: scale(0.97); opacity: 0.9; }
.start-workout-btn.completing { background: var(--accent2); }

/* ========== Timer ========== */
.timer-section {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  margin-bottom: 16px;
}
.timer-section .timer-display {
  font-size: 2.5rem;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: var(--accent);
}
.timer-section .timer-display.rest-mode { color: var(--accent3); }
.timer-section .timer-label {
  font-size: 0.8rem; color: var(--text2); margin-top: -4px;
}
.timer-section .timer-controls {
  display: flex; gap: 8px; justify-content: center; margin-top: 10px;
}
.timer-controls button {
  padding: 6px 16px;
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); border-radius: 20px;
  cursor: pointer; font-size: 0.8rem;
}
.timer-controls button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.timer-controls button:active { transform: scale(0.95); }

/* ========== Scoring Modal ========== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200; display: none;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  max-width: 380px; width: 100%;
  max-height: 90vh; overflow-y: auto;
}
.modal h2 { font-size: 1.2rem; margin-bottom: 16px; text-align: center; }
.modal .stat-row {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.modal .stat-row label { font-size: 0.9rem; color: var(--text2); }
.modal .stat-row .value { font-size: 1.1rem; font-weight: 700; color: var(--accent); }

/* Star rating */
.star-rating {
  display: flex; gap: 4px; flex-direction: row-reverse;
  justify-content: center;
}
.star-rating input { display: none; }
.star-rating label {
  font-size: 2rem; cursor: pointer; color: var(--text3);
  transition: 0.15s;
}
.star-rating label:hover,
.star-rating label:hover ~ label,
.star-rating input:checked ~ label { color: #ffc107; }

/* Slider */
.rating-slider {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  margin-bottom: 16px;
}
.rating-slider input[type="range"] {
  width: 100%; -webkit-appearance: none;
  height: 4px; border-radius: 2px;
  background: var(--bg3);
  outline: none;
}
.rating-slider input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}
.rating-slider .slider-label {
  display: flex; justify-content: space-between; width: 100%;
  font-size: 0.75rem; color: var(--text3);
}
.rating-slider .slider-value { font-size: 0.9rem; font-weight: 700; color: var(--accent); }

.rating-textarea {
  width: 100%; padding: 10px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: var(--radius-sm); color: var(--text);
  font-family: var(--font); font-size: 0.85rem;
  resize: vertical; min-height: 60px;
  margin-bottom: 16px;
}
.rating-textarea:focus { outline: none; border-color: var(--accent); }

.modal .btn-group {
  display: flex; gap: 10px;
}
.modal .btn-group button {
  flex: 1; padding: 12px; border: none; border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 600; cursor: pointer;
}
.modal .btn-group .btn-cancel { background: var(--bg3); color: var(--text2); }
.modal .btn-group .btn-save { background: var(--accent2); color: #fff; }
.modal .btn-group button:active { opacity: 0.8; }

/* ========== History ========== */
.history-list { padding: 0; }
.history-item {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px; margin-bottom: 8px;
  cursor: pointer;
}
.history-item .hi-header {
  display: flex; justify-content: space-between; margin-bottom: 4px;
}
.history-item .hi-date { font-size: 0.8rem; color: var(--text2); }
.history-item .hi-week { font-size: 0.7rem; background: var(--bg3); padding: 1px 8px; border-radius: 10px; }
.history-item .hi-name { font-weight: 600; font-size: 0.95rem; }
.history-item .hi-score {
  text-align: right;
}
.history-item .hi-score .num {
  font-size: 1.2rem; font-weight: 700; color: var(--accent);
}
.history-item .hi-score .label { font-size: 0.7rem; color: var(--text3); }
.history-item .hi-detail {
  font-size: 0.78rem; color: var(--text2);
  margin-top: 4px;
  display: none;
}
.history-item.expanded .hi-detail { display: block; }
.history-item .hi-detail table { width: 100%; }
.history-item .hi-detail td { padding: 2px 4px; font-size: 0.78rem; }
.history-item .hi-detail td:last-child { text-align: right; color: var(--text3); }

.empty-state {
  text-align: center; padding: 40px 20px;
  color: var(--text3);
}
.empty-state p { font-size: 0.9rem; margin-top: 8px; }

/* ========== Settings ========== */
.settings-section {
  margin-bottom: 24px;
}
.settings-section h3 {
  font-size: 0.95rem; margin-bottom: 12px;
  color: var(--text);
}
.setting-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--border);
}
.setting-row label { font-size: 0.85rem; color: var(--text2); }
.setting-row input[type="time"] {
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 6px 10px;
  border-radius: var(--radius-sm); font-size: 0.85rem;
}
.setting-row input[type="number"] {
  width: 60px;
  background: var(--bg); border: 1px solid var(--border);
  color: var(--text); padding: 6px 10px;
  border-radius: var(--radius-sm); font-size: 0.85rem;
  text-align: center;
}
.days-toggle {
  display: flex; gap: 6px; flex-wrap: wrap;
}
.days-toggle button {
  width: 40px; height: 40px; border-radius: 50%;
  border: 2px solid var(--border); background: var(--bg);
  color: var(--text2); font-size: 0.75rem; font-weight: 600;
  cursor: pointer; transition: 0.2s;
}
.days-toggle button.on {
  background: var(--accent); border-color: var(--accent); color: #fff;
}
.days-toggle button:active { transform: scale(0.9); }

/* ========== Video Modal ========== */
.video-modal {
  position: fixed; inset: 0; z-index: 300;
  background: rgba(0,0,0,0.9);
  display: none; align-items: center; justify-content: center;
  padding: 12px;
}
.video-modal.show { display: flex; }
.video-modal .video-wrapper {
  width: 100%; max-width: 500px;
  position: relative;
}
.video-modal .video-wrapper iframe {
  width: 100%; aspect-ratio: 16/9;
  border: none; border-radius: var(--radius-sm);
}
.video-modal .close-video {
  position: absolute; top: -36px; right: 0;
  background: none; border: none;
  color: #fff; font-size: 1.3rem; cursor: pointer;
}

/* ========== Bottom Nav ========== */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex; z-index: 100;
  padding-bottom: env(safe-area-inset-bottom, 0);
}
.nav-item {
  flex: 1; padding: 8px 4px 6px;
  background: none; border: none;
  color: var(--text3); font-size: 0.65rem;
  cursor: pointer; transition: 0.2s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.nav-item .nav-icon { font-size: 1.4rem; line-height: 1; }
.nav-item.active { color: var(--accent); }
.nav-item:active { opacity: 0.7; }

/* ========== Workout Active ========== */
.exercise-card.active-ex {
  border-color: var(--accent);
  border-left: 3px solid var(--accent);
}

/* ========== Misc ========== */
.progress-bar {
  height: 4px; background: var(--bg3); border-radius: 2px;
  margin: 8px 0; overflow: hidden;
}
.progress-bar .fill {
  height: 100%; background: var(--accent2);
  border-radius: 2px; transition: width 0.3s;
}
.text-accent { color: var(--accent); }
.text-success { color: var(--accent2); }
.text-muted { color: var(--text2); }
.mb-8 { margin-bottom: 8px; }
.mb-16 { margin-bottom: 16px; }

.no-select { -webkit-user-select: none; user-select: none; }

/* Exercise count badge */
.ex-count-badge {
  display: inline-block;
  background: var(--bg3);
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.72rem;
  color: var(--text2);
}

/* Workout Mode indicator */
.workout-active-indicator {
  display: none;
  position: fixed; top: 0; left: 0; right: 0; z-index: 50;
  background: var(--accent2);
  padding: 4px; text-align: center;
  font-size: 0.75rem; font-weight: 600; color: #fff;
}
.workout-active-indicator.show { display: block; }

/* Notification test */
.test-notif-btn {
  font-size: 0.8rem; color: var(--accent3);
  background: none; border: none; cursor: pointer;
  padding: 4px 0;
}
.test-notif-btn:active { opacity: 0.7; }

/* ========== Calendar ========== */
.cal-nav {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px;
}
.cal-nav .month-title {
  font-size: 1.05rem; font-weight: 700;
}
.cal-nav button {
  background: var(--bg3); border: 1px solid var(--border);
  color: var(--text); padding: 6px 14px;
  border-radius: var(--radius-sm); cursor: pointer;
  font-size: 0.85rem;
}
.cal-nav button:active { opacity: 0.7; }

.cal-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 3px;
  margin-bottom: 16px;
}
.cal-grid .cal-header {
  text-align: center; font-size: 0.7rem; font-weight: 600;
  color: var(--text3); padding: 4px 0;
}
.cal-grid .cal-day {
  text-align: center; padding: 6px 2px;
  border-radius: var(--radius-sm);
  font-size: 0.8rem; font-weight: 500;
  min-height: 44px;
  position: relative;
  cursor: pointer;
  background: var(--bg2);
  display: flex; flex-direction: column; align-items: center;
  gap: 2px;
}
.cal-grid .cal-day.other-month { opacity: 0.25; }
.cal-grid .cal-day.training {
  background: rgba(255,107,53,0.15);
  border: 1px solid rgba(255,107,53,0.3);
}
.cal-grid .cal-day.completed {
  background: rgba(0,200,83,0.15);
  border: 1px solid rgba(0,200,83,0.3);
}
.cal-grid .cal-day.today {
  box-shadow: 0 0 0 2px var(--accent2);
}
.cal-grid .cal-day .cal-date {
  font-weight: 700; font-size: 0.85rem;
}
.cal-grid .cal-day .cal-label {
  font-size: 0.55rem; color: var(--text3);
  line-height: 1.1;
  word-break: break-word;
}
.cal-grid .cal-day .cal-check {
  font-size: 0.6rem;
  color: var(--accent2);
}
.cal-grid .cal-day .cal-score {
  font-size: 0.55rem;
  color: var(--accent);
  font-weight: 700;
}

.cal-day:active { transform: scale(0.95); }

/* ========== Nutrition ========== */
.nutrition-page { padding: 0; }
.nutrition-page h2 { font-size: 1.1rem; margin-bottom: 12px; }

.nutri-card {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  margin-bottom: 12px;
}
.nutri-card h3 {
  font-size: 0.95rem; margin-bottom: 8px;
}
.nutri-card .macro-line {
  display: flex; justify-content: space-between; align-items: center;
  padding: 4px 0; font-size: 0.85rem;
}
.nutri-card .macro-bar {
  height: 6px; border-radius: 3px; margin: 4px 0 10px;
  background: var(--bg3); overflow: hidden;
  display: flex;
}
.nutri-card .macro-bar .fill-protein { background: var(--accent); }
.nutri-card .macro-bar .fill-carbs { background: var(--accent3); }
.nutri-card .macro-bar .fill-fat { background: var(--warn); }

.food-item {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  display: flex; justify-content: space-between; align-items: center;
  font-size: 0.82rem;
}
.food-item:last-child { border-bottom: none; }
.food-item .food-name { font-weight: 600; }
.food-item .food-sr { color: var(--text3); font-size: 0.72rem; }
.food-item .food-where { color: var(--accent3); font-size: 0.72rem; }

/* Post-workout nutrition summary in modal */
.post-nutri {
  background: rgba(0,200,83,0.08);
  border: 1px solid rgba(0,200,83,0.2);
  border-radius: var(--radius-sm);
  padding: 12px;
  margin-top: 12px;
}
.post-nutri .pn-title {
  font-size: 0.85rem; font-weight: 700; margin-bottom: 8px;
  color: var(--accent2);
}
.post-nutri .pn-macros {
  display: flex; gap: 8px; justify-content: center;
}
.post-nutri .pn-macro {
  text-align: center; padding: 6px 12px;
  background: var(--bg); border-radius: var(--radius-sm);
  flex: 1;
}
.post-nutri .pn-macro .val {
  font-size: 1.1rem; font-weight: 700;
}
.post-nutri .pn-macro .lab {
  font-size: 0.65rem; color: var(--text3);
}
.post-nutri .pn-macro.protein .val { color: var(--accent); }
.post-nutri .pn-macro.carbs .val { color: var(--accent3); }
.post-nutri .pn-macro.fat .val { color: var(--warn); }

.post-nutri .pn-meals {
  margin-top: 10px;
}
.post-nutri .pn-meal {
  font-size: 0.78rem; padding: 4px 0;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}
.post-nutri .pn-meal:last-child { border-bottom: none; }
.post-nutri .pn-meal strong { color: var(--text); }

.nutri-tabs {
  display: flex; gap: 4px; margin-bottom: 12px;
}
.nutri-tabs button {
  flex: 1; padding: 8px 4px;
  background: var(--bg2); border: 1px solid var(--border);
  color: var(--text2); border-radius: var(--radius-sm);
  font-size: 0.78rem; font-weight: 600; cursor: pointer;
}
.nutri-tabs button.active {
  background: var(--bg3); color: var(--accent);
  border-color: var(--accent);
}
</style>
</head>
<body>

// Helper: get today's scheduled workout
function getTodayWorkout() {
  const now = new Date();
  const day = now.getDay() || 7; // Sun=0 → 7
  const scheduleIndex = TRAINING_DATA.schedule.indexOf(day);
  if (scheduleIndex === -1) return null;
  
  // Determine which week: Week A for even weeks, Week B for odd
  const weekNum = getWeekNumber(now);
  const weekKey = weekNum % 2 === 0 ? 'A' : 'B';
  
  return {
    weekKey,
    dayIndex: scheduleIndex,
    weekData: TRAINING_DATA.weeks[weekKey],
    dayData: TRAINING_DATA.weeks[weekKey].days[scheduleIndex]
  };
}

function getWeekNumber(d) {
  const date = new Date(d.getTime());
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
  const week1 = new Date(date.getFullYear(), 0, 4);
  return 1 + Math.round(((date - week1) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
}

function getCurrentWeek() {
  return getWeekNumber(new Date());
}

// ---------- Database ----------
const DB_KEY = 'fittracker_v2';
function defaultDB() {
  return {
    settings: {
      trainingDays: [1, 3, 5, 7],
      reminderTime: '17:00',
      reminderBefore: 15,
    },
    workouts: [],

function loadDB() {
  try {

// ---------- Routing ----------
function navigate(tab) {
  STATE.currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(`page-${tab}`).classList.add('active');

  if (navItem) navItem.classList.add('active');
  renderCurrentPage();
}

function renderCurrentPage() {
  switch (STATE.currentTab) {

    case 'history': renderHistory(); break;
    case 'nutrition': renderNutrition(); break;
    case 'settings': renderSettings(); break;
  }

// ============================================================
// CALENDAR VIEW (replaces the old plans list)
// ============================================================

function renderCalendar() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + STATE.calMonthOffset;
  
  // Handle year rollover
  let calYear = year;
  let calMonth = month;
  if (calMonth < 0) { calMonth = 11; calYear--; }
  if (calMonth > 11) { calMonth = 0; calYear++; }
  
  const weekNum = getCurrentWeek();
  const weekKey = weekNum % 2 === 0 ? 'A' : 'B';
  const weekLabel = TRAINING_DATA.weeks[weekKey].label;
  
  document.getElementById('week-label').textContent = `第 ${weekNum} 周 · ${weekLabel}`;
  
  const monthNames = ['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  const dayNames = ['日','一','二','三','四','五','六'];
  
  // Get first day and days in month
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  
  // Get completed workout dates
  const completedDates = new Set();
  const completedScores = {};
  DB.workouts.forEach(w => {
    completedDates.add(w.date);
    completedScores[w.date] = w.score?.overall;
  });
  
  // Build calendar HTML
  let html = `
    <div class="cal-nav">
      <button onclick="changeMonth(-1)">← ${monthNames[calMonth-1 < 0 ? 11 : calMonth-1]}</button>
      <span class="month-title">${calYear}年 ${monthNames[calMonth]}</span>
      <button onclick="changeMonth(1)">${monthNames[calMonth+1 > 11 ? 0 : calMonth+1]} →</button>
    </div>
    <div class="cal-grid">
  `;
  
  // Day headers
  dayNames.forEach(d => {
    html += `<div class="cal-header">${d}</div>`;
  });
  
  // Empty cells before first day
  for (let i = 0; i < (firstDay === 0 ? 6 : firstDay - 1); i++) {
    html += `<div class="cal-day other-month"></div>`;
  }
  
  // Day cells
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayOfWeek = new Date(calYear, calMonth, d).getDay() || 7;
    const isTrainingDay = TRAINING_DATA.schedule.includes(dayOfWeek);
    const isCompleted = completedDates.has(dateStr);
    const isToday = new Date().toISOString().split('T')[0] === dateStr;
    const score = completedScores[dateStr];
    
    // Calculate which day of the training schedule and week pattern
    const scheduleIdx = TRAINING_DATA.schedule.indexOf(dayOfWeek);
    const weekOfDate = getWeekNumber(new Date(calYear, calMonth, d));
    const dateWeekKey = weekOfDate % 2 === 0 ? 'A' : 'B';
    
    let classes = 'cal-day';
    if (!isTrainingDay) classes += ' other-month';
    if (isTrainingDay) classes += ' training';
    if (isCompleted) classes += ' completed';
    if (isToday) classes += ' today';
    
    let label = '';
    let check = '';
    if (isTrainingDay && scheduleIdx >= 0) {
      const dayData = TRAINING_DATA.weeks[dateWeekKey]?.days[scheduleIdx];
      if (dayData) label = dayData.name;
    }
    if (isCompleted) check = '✓';
    
    html += `
      <div class="${classes}" onclick="${isTrainingDay && scheduleIdx >= 0 && !isCompleted ? `viewDayFromCal('${dateWeekKey}',${scheduleIdx})` : (isCompleted ? `viewCompletedWorkout('${dateStr}')` : '')}">
        <div class="cal-date">${d}</div>
        ${label ? `<div class="cal-label">${label}</div>` : ''}
        ${check ? `<div class="cal-check">${check}</div>` : ''}
        ${score ? `<div class="cal-score">${score}</div>` : ''}
      </div>
    `;
  }
  
  html += `</div>`;
  
  // Today's workout quick start section
  const todayWorkout = getTodayWorkout();
  if (todayWorkout) {
    const day = todayWorkout.dayData;
    const exists = DB.workouts.some(w => w.date === new Date().toISOString().split('T')[0] && w.dayName === day.name);
    if (!exists) {
      html += `
        <div class="day-card today" onclick="viewDay('${todayWorkout.weekKey}', ${todayWorkout.dayIndex})">
          <div class="day-header">
            <div class="day-name">📌 今日训练 · ${day.name}</div>
            <div class="day-tag">${todayWorkout.weekKey === 'A' ? 'Week A' : 'Week B'}</div>
          </div>
          <div class="part-summary">${getDaySummary(day)}</div>
        </div>
      `;
    } else {
      html += `
        <div class="day-card completed" style="opacity:0.6;">
          <div class="day-header">
            <div class="day-name">✅ 今日训练已完成</div>
          </div>
        </div>
      `;
    }
  }
  
  document.getElementById('plans-list').innerHTML = html;
}

}

// ============================================================
// WORKOUT MODE
// ============================================================

function startWorkout(weekKey, dayIdx) {
  const weekData = TRAINING_DATA.weeks[weekKey];
  const day = weekData.days[dayIdx];
  const today = new Date();
  
  STATE.activeWorkout = {
    id: DB.nextId++,
    weekKey,
    dayIdx,
    dayName: day.name,
    date: today.toISOString().split('T')[0],
    timestamp: today.toISOString(),
    startTime: Date.now(),
    exercises: [],
    completed: false,
  };
  
  day.parts.forEach(part => {
    part.exercises.forEach(ex => {
      STATE.activeWorkout.exercises.push({
        name: ex.name,
        sets: Array.from({length: ex.sets}, () => ({
          weight: 0,
          reps: 0,
          done: false,
        })),
        done: false,
        rest: ex.rest || 60,
      });
    });
  });
  
  STATE.currentExIndex = 0;
  STATE.currentSetIndex = 0;
  STATE.workoutSeconds = 0;
  STATE.isResting = false;
  
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-workout').classList.add('active');
  document.querySelector('.workout-active-indicator').classList.add('show');
  
  startWorkoutTimer();
  renderWorkout();
}

function startWorkoutTimer() {
  if (STATE.workoutTimer) clearInterval(STATE.workoutTimer);
  STATE.workoutTimer = setInterval(() => {
    STATE.workoutSeconds++;
    if (!STATE.isResting) updateWorkoutTimer();
  }, 1000);
}

function updateWorkoutTimer() {
  const el = document.getElementById('workout-total-time');
  if (el) el.textContent = formatTime(STATE.workoutSeconds);
}

  const workout = STATE.activeWorkout;

}

function updateSet(si, field, value) {
  const ex = STATE.activeWorkout.exercises[STATE.currentExIndex];
  ex.sets[si][field] = parseFloat(value) || 0;
}

function toggleSet(si) {
  const ex = STATE.activeWorkout.exercises[STATE.currentExIndex];
  ex.sets[si].done = !ex.sets[si].done;
  ex.done = ex.sets.every(s => s.done);
  renderWorkout();
}

function nextExercise() {
  const workout = STATE.activeWorkout;
  const ex = workout.exercises[STATE.currentExIndex];
  const total = workout.exercises.length;
  
  if (ex.sets.some(s => s.done)) ex.done = true;
  
  if (STATE.currentExIndex < total - 1) {
    STATE.currentExIndex++;
    STATE.currentSetIndex = 0;
    const nextEx = workout.exercises[STATE.currentExIndex];
    if (ex.rest && ex.rest > 0) { startRestTimer(ex.rest); renderWorkout(); }
    else renderWorkout();
  } else {
    completeWorkout();
  }
}

function prevExercise() {
  if (STATE.currentExIndex > 0) {
    STATE.currentExIndex--;
    STATE.currentSetIndex = 0;
    STATE.isResting = false;
    if (STATE.restTimer) clearInterval(STATE.restTimer);
    renderWorkout();
  }
}

function startRestTimer(seconds) {
  STATE.isResting = true;
  STATE.restSeconds = seconds;
  if (STATE.restTimer) clearInterval(STATE.restTimer);
  
  const area = document.getElementById('rest-timer-area');
  if (area) area.style.display = 'block';
  
  STATE.restTimer = setInterval(() => {
    STATE.restSeconds--;
    const d = document.getElementById('rest-timer-display');
    if (d) d.textContent = formatTime(Math.max(0, STATE.restSeconds));
    
    if (STATE.restSeconds <= 0) {
      clearInterval(STATE.restTimer);
      STATE.restTimer = null;
      STATE.isResting = false;
      if (navigator.vibrate) navigator.vibrate(200);
      renderWorkout();
    }
  }, 1000);
}

function skipRest() {
  if (STATE.restTimer) clearInterval(STATE.restTimer);
  STATE.restTimer = null;
  STATE.isResting = false;
  renderWorkout();
}

// ============================================================
// SCORING + POST-WORKOUT NUTRITION
// ============================================================

function completeWorkout() {
  if (STATE.workoutTimer) clearInterval(STATE.workoutTimer);
  STATE.workoutTimer = null;
  STATE.isResting = false;
  if (STATE.restTimer) clearInterval(STATE.restTimer);
  
  STATE.activeWorkout.completed = true;
  STATE.activeWorkout.endTime = Date.now();
  STATE.activeWorkout.duration = STATE.workoutSeconds;
  
  showScoringModal();
}

function showScoringModal() {
  const workout = STATE.activeWorkout;
  const totalTime = STATE.workoutSeconds;
  const totalSets = workout.exercises.reduce((s, ex) => s + ex.sets.length, 0);
  const doneSets = workout.exercises.reduce((s, ex) => s + ex.sets.filter(st => st.done).length, 0);
  const doneExercises = workout.exercises.filter(e => e.sets.some(s => s.done)).length;
  const totalExercises = workout.exercises.length;
  
  const overlay = document.getElementById('scoring-modal');
  overlay.classList.add('show');
  
  overlay.innerHTML = `
    <div class="modal">
      <h2>🏁 训练完成！</h2>
      
      <div class="stat-row"><label>用时</label><span class="value">${formatTime(totalTime)}</span></div>
      <div class="stat-row"><label>完成组数</label><span class="value">${doneSets}/${totalSets}</span></div>
      <div class="stat-row"><label>完成动作</label><span class="value">${doneExercises}/${totalExercises}</span></div>
      
      <div style="margin:16px 0;border-top:1px solid var(--border);padding-top:16px;">
        <div style="font-size:0.9rem;font-weight:600;margin-bottom:12px;text-align:center;">自我评分</div>
        
        <div class="rating-slider">
          <div class="slider-value" id="score-effort-val">7</div>
          <input type="range" id="score-effort" min="1" max="10" value="7" oninput="updateSliderVal('score-effort', 'score-effort-val')">
          <div class="slider-label"><span>轻松</span><span>💪 努力程度</span><span>拼尽全力</span></div>
        </div>
        
        <div class="rating-slider">
          <div class="slider-value" id="score-energy-val">7</div>
          <input type="range" id="score-energy" min="1" max="10" value="7" oninput="updateSliderVal('score-energy', 'score-energy-val')">
          <div class="slider-label"><span>状态差</span><span>⚡ 身体状态</span><span>状态爆棚</span></div>
        </div>
        
        <div class="rating-slider">
          <div class="slider-value" id="score-pump-val">7</div>
          <input type="range" id="score-pump" min="1" max="10" value="7" oninput="updateSliderVal('score-pump', 'score-pump-val')">
          <div class="slider-label"><span>没感觉</span><span>🔥 泵感/发力感</span><span>爆炸泵感</span></div>
        </div>
        
        <textarea class="rating-textarea" id="score-notes" placeholder="训练备注（哪里做得好？下次注意什么？）"></textarea>
      </div>
      
      <div class="btn-group">
        <button class="btn-cancel" onclick="closeScoringModal()">以后再评</button>
        <button class="btn-save" onclick="saveScore()">✓ 保存评分</button>
      </div>
    </div>
  `;
  
  setTimeout(() => document.getElementById('score-effort')?.focus(), 300);
}

function updateSliderVal(inputId, valId) {
  document.getElementById(valId).textContent = document.getElementById(inputId).value;
}

function closeScoringModal() {
  document.getElementById('scoring-modal').classList.remove('show');
  if (STATE.activeWorkout) finishWorkoutSession();
}

function saveScore() {
  const effort = parseInt(document.getElementById('score-effort').value);
  const energy = parseInt(document.getElementById('score-energy').value);
  const pump = parseInt(document.getElementById('score-pump').value);
  const notes = document.getElementById('score-notes').value;
  
  const workout = STATE.activeWorkout;
  const doneSets = workout.exercises.reduce((s, ex) => s + ex.sets.filter(st => st.done).length, 0);
  const totalSets = workout.exercises.reduce((s, ex) => s + ex.sets.length, 0);
  const completionRate = doneSets / Math.max(totalSets, 1);
  
  const score = Math.round(
    (effort * 0.4 + energy * 0.3 + pump * 0.15 + (completionRate * 10) * 0.15) * 10
  ) / 10;
  
  workout.score = {
    effort, energy, pump,
    completion: Math.round(completionRate * 100),
    overall: score, notes,
  };
  
  DB.workouts.push(JSON.parse(JSON.stringify(workout)));
  saveDB();
  
  document.getElementById('scoring-modal').classList.remove('show');
  
  // Show post-workout nutrition
  showPostWorkoutNutrition(score);
}

// ============================================================
// SETTINGS
// ============================================================

function renderSettings() {
  const s = DB.settings;
  
  document.querySelectorAll('.days-toggle button').forEach(btn => {
    const day = parseInt(btn.dataset.day);
    btn.classList.toggle('on', s.trainingDays.includes(day));
    btn.onclick = () => toggleDay(day);
  });
  
  const timeInput = document.getElementById('reminder-time');
  if (timeInput) timeInput.value = s.reminderTime;
  
  const beforeInput = document.getElementById('reminder-before');
  if (beforeInput) beforeInput.value = s.reminderBefore;
}

function toggleDay(day) {
  const s = DB.settings;
  const idx = s.trainingDays.indexOf(day);
  if (idx >= 0) {
    if (s.trainingDays.length <= 1) return;
    s.trainingDays.splice(idx, 1);
  } else {
    s.trainingDays.push(day);
    s.trainingDays.sort((a, b) => a - b);
  }
  saveDB();
  renderSettings();
}

function saveReminderSettings() {
  const s = DB.settings;
  s.reminderTime = document.getElementById('reminder-time').value || '17:00';
  s.reminderBefore = parseInt(document.getElementById('reminder-before').value) || 15;
  saveDB();
  scheduleReminder();
  showToast('✅ 提醒设置已保存');
}

function requestNotificationPermission() {
  if (!('Notification' in window)) { showToast('⚠️ 当前浏览器不支持桌面通知'); return; }
  Notification.requestPermission().then(perm => {
    if (perm === 'granted') {
      showToast('✅ 通知已开启！');
      scheduleReminder();
    } else {
      showToast('⚠️ 通知被拒绝');
    }
  });
}

function testNotification() {
  if (!('Notification' in window)) { showToast('⚠️ 不支持通知'); return; }
  if (Notification.permission !== 'granted') {
    Notification.requestPermission().then(perm => {
      if (perm === 'granted') new Notification('💪 FitTracker', { body: '通知正常！', icon: 'icons/icon-192.png' });
    });
  } else {
    new Notification('💪 FitTracker', { body: '通知正常！', icon: 'icons/icon-192.png' });
  }
}

function scheduleReminder() {
  const s = DB.settings;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  
  const today = new Date().getDay() || 7;
  if (!s.trainingDays.includes(today)) return;
  
  const [h, m] = s.reminderTime.split(':').map(Number);
  const now = new Date();
  const reminderTime = new Date(now);
  reminderTime.setHours(h, m - (s.reminderBefore || 15), 0, 0);
  
  const msUntilReminder = reminderTime.getTime() - now.getTime();
  
  if (msUntilReminder > 0 && msUntilReminder < 86400000) {
    setTimeout(() => {
      new Notification('🏋️ 训练时间到！', {
        body: `今天该练了！${s.reminderBefore}分钟后开始？`,
        icon: 'icons/icon-192.png'
      });
    }, msUntilReminder);
  }
}

// ============================================================
// UTILITY
// ============================================================

function formatTime(seconds) {
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
}

function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  const month = d.getMonth() + 1;
  const day = d.getDate();
  const days = ['日', '一', '二', '三', '四', '五', '六'];
  return `${month}月${day}日 周${days[d.getDay()]}`;
}

function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `fittracker-${new Date().toISOString().split('T')[0]}.json`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ 数据已导出');
}

function clearData() {
  if (!confirm('确定清除所有训练数据？此操作不可恢复！')) return;
  localStorage.removeItem(DB_KEY);
  DB = defaultDB();
  saveDB();
  showToast('✅ 数据已清除');
  renderCurrentPage();
}

function playVideo(videoId) {
  // Show inline YouTube embed in modal
  var overlay = document.getElementById('scoring-modal');
  overlay.classList.add('show');
  overlay.innerHTML = '<div class="modal" style="max-width:500px;"><div style="text-align:right;"><button onclick="document.getElementById(\'scoring-modal\').classList.remove(\'show\')" style="background:none;border:none;color:var(--text);font-size:1.2rem;cursor:pointer;">×</button></div><div style="position:relative;width:100%;aspect-ratio:16/9;"><iframe src="https://www.youtube.com/embed/'+videoId+'?autoplay=1" style="width:100%;height:100%;border:none;border-radius:8px;" allow="autoplay;fullscreen" allowfullscreen></iframe></div></div>';
}

function showToast(msg) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.style.cssText = `
      position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
      background:var(--bg2);color:var(--text);padding:12px 20px;
      border-radius:20px;font-size:0.85rem;font-weight:600;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
      z-index:400;opacity:0;transition:opacity 0.3s;
      max-width:90%;text-align:center;
      border:1px solid var(--border);
    `;
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._hide);
  el._hide = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// ============================================================
// INIT
// ============================================================

function init() {
  const weekNum = getCurrentWeek();
  STATE.currentWeek = weekNum % 2 === 0 ? 'A' : 'B';
  
  // Tab navigation (Week A/B)
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (STATE.activeWorkout) { showToast('⚠️ 正在训练中'); return; }
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      STATE.currentWeek = btn.dataset.week;
      renderCalendar();
    });
  });
  
  // Bottom nav
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const tab = item.dataset.tab;
      if (STATE.activeWorkout && tab !== 'workout') {
        showToast('⚠️ 正在训练中，结束后再切换');
        return;
      }
      navigate(tab);
    });
  });
  
  // Settings events
  document.getElementById('save-settings')?.addEventListener('click', saveReminderSettings);
  document.getElementById('request-notif')?.addEventListener('click', requestNotificationPermission);
  document.getElementById('test-notif')?.addEventListener('click', testNotification);
  
  // Initial render
  navigate('plans');
  
  // Reminder check
  scheduleReminder();
  setInterval(() => {
    if (document.hidden) return;
    scheduleReminder();
  }, 60000);
}

document.addEventListener('DOMContentLoaded', init);
